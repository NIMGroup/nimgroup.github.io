params:
  description: 'NIMG researches AI and machine learning for intelligent medicine, with a focus on neural navigation and image-enabled brain-computer interfaces.'
  author: NIMG
  # googleAnalyticsID: "G-XXXXX"
  DateFormat: 'January 2006'
  defaultTheme: light
