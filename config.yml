  TocOpen: true
  ShowWordCount: false
  UseHugoToc: true
  comments: true
  math: true
  profileMode:
    enabled: true
    title: 神经影像智能理解实验室（NIMG@NJUST）
    subtitle: '我们聚焦脑科学 × AI × 智能医学交叉前沿，探索脑连接组、脑机接口、精准神经导航、人脑数字孪生等方向。这里不迷信刷榜，不沉迷堆模型，而是坚持解决真实问题，打造可解释、可复现、可落地的技术。我们希望，每一个灵感都能成长为一篇论文、一套代码、一个开源工具、一款产品，甚至一次改变临床实践的创新。如果你热爱科研、喜欢写代码、敢于探索未知，NIMG 或许正是你下一段旅程的起点。'
